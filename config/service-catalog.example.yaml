services:
  - serviceId: payments-api
    displayName: Payments API
    cluster: prodops-uat
    namespace: payments-uat
    workloadName: payments-api
    workloadKind: DEPLOYMENT
    serviceName: payments-api
    criticality: critical
    ownerTeam: cards-platform
    dashboardUids:
      - payments-latency
    sloTargets:
      - name: p95 latency
        objective: 99.0
        threshold: 500ms
        measurementWindow: 30d
      - name: availability
        objective: 99.9
        threshold: 0.1% errors
        measurementWindow: 30d
    runbookLinks:
      - https://runbooks.example.internal/payments-api
    promqlTemplates:
      error_rate: clamp_max(0.82,1)
      latency: clamp_max(0.91,1)
      cpu: clamp_max(0.47,1)
      memory: clamp_max(0.52,1)
      throttling: clamp_max(0.25,1)
      saturation: clamp_max(0.68,1)
    repoWorkspace: prodops
    repoProject: PRODOPS
    repoSlug: payments-api
    fileOwnershipPaths:
      - src/main/java/com/prodops/payments
      - src/main/resources/application
    traceServiceName: payments-api
    traceOperationHints:
      - POST /api/payments
      - GET /api/payments/{id}
    kibanaQuery: service.name:"payments-api" OR kubernetes.labels.app:"payments-api"
    kibanaDataView: prodops-logs
    versionLabelKeys:
      - app.kubernetes.io/version
      - release
      - image-tag
    deploymentLabelKeys:
      - app
      - component
    imageTagHints:
      - payments-api
      - payments
    dependencyServiceIds:
      - payments-ledger
      - payments-notification
  - serviceId: upi-recon
    displayName: UPI Reconciliation
    cluster: prodops-uat
    namespace: upi-ops
    workloadName: upi-recon
    workloadKind: DEPLOYMENT
    serviceName: upi-recon
    criticality: high
    ownerTeam: recon-engineering
    dashboardUids:
      - upi-recon-saturation
    sloTargets:
      - name: p95 latency
        objective: 99.0
        threshold: 1500ms
        measurementWindow: 30d
    runbookLinks:
      - https://runbooks.example.internal/upi-recon
    promqlTemplates:
      error_rate: clamp_max(0.24,1)
      latency: clamp_max(0.86,1)
      cpu: clamp_max(0.94,1)
      memory: clamp_max(0.79,1)
      throttling: clamp_max(0.61,1)
      saturation: clamp_max(0.89,1)
    repoWorkspace: prodops
    repoProject: PRODOPS
    repoSlug: upi-recon
    fileOwnershipPaths:
      - src/main/java/com/prodops/upi/recon
      - src/main/resources/application
    traceServiceName: upi-recon
    traceOperationHints:
      - POST /upi/recon/process
      - GET /upi/recon/status
    kibanaQuery: service.name:"upi-recon" OR kubernetes.labels.app:"upi-recon"
    kibanaDataView: prodops-logs
    versionLabelKeys:
      - app.kubernetes.io/version
      - release
      - image-tag
    deploymentLabelKeys:
      - app
      - component
    imageTagHints:
      - upi-recon
      - upi
    dependencyServiceIds:
      - upi-settlement
      - upi-core
  - serviceId: tradex-gateway
    displayName: Tradex Gateway
    cluster: prodops-uat
    namespace: tradex-edge
    workloadName: tradex-gateway
    workloadKind: DEPLOYMENT
    serviceName: tradex-gateway
    criticality: high
    ownerTeam: tradex
    dashboardUids:
      - tradex-alert-storm
    sloTargets:
      - name: error budget
        objective: 99.5
        threshold: 0.5% errors
        measurementWindow: 30d
    runbookLinks:
      - https://runbooks.example.internal/tradex-gateway
    promqlTemplates:
      error_rate: clamp_max(0.28,1)
      latency: clamp_max(0.33,1)
      cpu: clamp_max(0.41,1)
      memory: clamp_max(0.45,1)
      throttling: clamp_max(0.22,1)
      saturation: clamp_max(0.31,1)
    repoWorkspace: prodops
    repoProject: PRODOPS
    repoSlug: tradex-gateway
    fileOwnershipPaths:
      - src/main/java/com/prodops/tradex/gateway
      - src/main/resources/application
    traceServiceName: tradex-gateway
    traceOperationHints:
      - POST /trade/orders
      - GET /trade/orders/{id}
    kibanaQuery: service.name:"tradex-gateway" OR kubernetes.labels.app:"tradex-gateway"
    kibanaDataView: prodops-logs
    versionLabelKeys:
      - app.kubernetes.io/version
      - release
      - image-tag
    deploymentLabelKeys:
      - app
      - component
    imageTagHints:
      - tradex-gateway
      - tradex
    dependencyServiceIds:
      - tradex-pricing
      - tradex-risk
