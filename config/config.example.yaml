prodops:
  controltower:
    product-name: ProdOps Control Tower MCP
    product-domain: Production Support Intelligence
    catalog:
      enabled: true
      path: config/service-catalog.example.yaml
      refresh-interval: PT5M
    risk-model:
      path: config/risk-weights.example.yaml
      refresh-interval: PT5M
    guardrails:
      max-lookback: PT6H
      max-range: PT24H
      min-step: PT5M
      default-lookback: PT60M
      max-series: 250
      max-log-lines: 100
      max-log-hits: 200
      max-dashboards: 10
      max-events: 200
      max-traces: 50
      max-trace-spans: 200
      max-change-candidates: 20
      max-evidence-nodes: 100
      max-similar-incidents: 5
      max-topology-nodes: 30
      max-alert-groups: 20
      max-timeline-entries: 150
      max-comparison-clusters: 5
      raw-promql-enabled: true
      require-origin-validation: true
    cache:
      max-entries: 200
      namespace-inventory-ttl: PT2M
      dashboard-ttl: PT10M
      catalog-ttl: PT5M
    rate-limit:
      requests-per-window: 120
      window: PT1M
    http:
      bind-address: 127.0.0.1
      mcp-path: /mcp
      public-base-url: http://127.0.0.1:8080
      allowed-origins:
        - https://claude.ai
        - https://chat.openai.com
        - http://localhost:*
        - http://127.0.0.1:*
    security:
      jwt-enabled: false
      allow-anonymous-local-http: true
      issuer-uri: https://issuer.example.internal/realms/prodops-control-tower
      jwk-set-uri: https://issuer.example.internal/realms/prodops-control-tower/protocol/openid-connect/certs
      audience: prodops-control-tower-mcp
      required-scope: prodops.read
    fixture:
      base-path: fixtures
      scenarios:
        - scenario_payments_rollout_regression
        - scenario_upi_recon_saturation
        - scenario_tradex_alert_storm
        - scenario_checkout_dependency_regression
        - scenario_ledger_observability_gap
    clusters:
      - name: prodops-uat
        environment: UAT
        enabled: true
        namespace-allowlist:
          - payments-uat
          - upi-ops
          - tradex-edge
        team-label-key: owner-team
        criticality-label-key: criticality
        kubernetes:
          in-cluster: false
          kubeconfig: /path/to/kubeconfig
          context: prodops-uat
          logs-enabled: true
        prometheus:
          base-url: https://prometheus.uat.example.internal
          bearer-token-ref: PROMETHEUS_BEARER_TOKEN
          timeout: PT30S
        grafana:
          base-url: https://grafana.uat.example.internal
          bearer-token-ref: GRAFANA_BEARER_TOKEN
          default-folder: ProdOps
          timeout: PT30S
        bitbucket:
          base-url: https://bitbucket.example.internal
          bearer-token-ref: BITBUCKET_BEARER_TOKEN
          workspace: prodops
          project-key: PRODOPS
          repo-slug: payments-api
          browse-base-url: https://bitbucket.example.internal/projects/PRODOPS/repos/payments-api
          timeout: PT30S
        kibana:
          base-url: https://kibana.example.internal
          bearer-token-ref: KIBANA_BEARER_TOKEN
          default-data-view: prodops-logs
          elasticsearch-base-url: https://elasticsearch.example.internal
          discover-path: /app/discover
          timeout: PT30S
        jaeger:
          base-url: https://jaeger.example.internal
          bearer-token-ref: JAEGER_BEARER_TOKEN
          timeout: PT30S
